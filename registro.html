<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css"> <!-- Conexión con el archivo CSS -->
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form action="#" method="post">
        <!-- Sección de Datos Personales -->
        <fieldset>
            <legend>Datos Personales</legend>

            <!-- Nombre completo -->
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>

            <!-- Fecha de nacimiento -->
            <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
            <br><br>

            <!-- RUT/Número de documento -->
            <label for="documento">RUT/Número de Documento:</label>
            <input type="text" id="documento" name="documento" required>
            <br><br>

            <!-- Género -->
            <label for="genero">Género:</label>
            <select id="genero" name="genero" required>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="no-binario">No Binario</option>
                <option value="prefiero-no-decir">Prefiero no decir</option>
            </select>
            <br><br>

            <!-- Nacionalidad -->
            <label for="nacionalidad">Nacionalidad:</label>
            <select id="nacionalidad" name="nacionalidad" required>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
                <option value="mexico">México</option>
                <option value="colombia">Colombia</option>
                <option value="peru">Perú</option>
                <option value="brasil">Brasil</option>
                <option value="uruguay">Uruguay</option>
                <option value="paraguay">Paraguay</option>
            </select>
        </fieldset>
        <br>

        <!-- Sección de Datos de Contacto y Acceso -->
        <fieldset>
            <legend>Datos de Contacto y Acceso</legend>

            <!-- Correo electrónico -->
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <!-- Confirmar correo electrónico -->
            <label for="confirmar-email">Confirmar Correo Electrónico:</label>
            <input type="email" id="confirmar-email" name="confirmar-email" required>
            <br><br>

            <!-- Contraseña -->
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div id="password-strength" style="font-size: 0.9rem; color: gray;">Fuerza de la contraseña: débil</div>
            <br><br>

            <!-- Confirmar contraseña -->
            <label for="confirmar-password">Confirmar Contraseña:</label>
            <input type="password" id="confirmar-password" name="confirmar-password" required>
            <br><br>

            <!-- Teléfono -->
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+54 11 5555-0000" required>
        </fieldset>
        <br>

        <!-- Sección de Dirección de Entrega -->
        <fieldset>
            <legend>Dirección de Entrega</legend>

            <!-- País -->
            <label for="pais">País:</label>
            <select id="pais" name="pais" required>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
                <option value="mexico">México</option>
                <option value="colombia">Colombia</option>
                <option value="peru">Perú</option>
                <option value="brasil">Brasil</option>
                <option value="uruguay">Uruguay</option>
                <option value="paraguay">Paraguay</option>
            </select>
            <br><br>

            <!-- Provincia/Estado -->
            <label for="provincia">Provincia/Estado:</label>
            <input type="text" id="provincia" name="provincia" required>
            <br><br>

            <!-- Ciudad -->
            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" name="ciudad" required>
            <br><br>

            <!-- Calle y número -->
            <label for="calle-numero">Calle y Número:</label>
            <input type="text" id="calle-numero" name="calle-numero" required>
            <br><br>

            <!-- Código postal -->
            <label for="codigo-postal">Código Postal:</label>
            <input type="text" id="codigo-postal" name="codigo-postal" required>
            <br><br>

            <!-- Piso y departamento -->
            <label for="piso-departamento">Piso y Departamento (opcional):</label>
            <input type="text" id="piso-departamento" name="piso-departamento">
            <br><br>

            <!-- Referencia o instrucciones adicionales -->
            <label for="referencia">Referencia o Instrucciones Adicionales (opcional):</label>
            <textarea id="referencia" name="referencia" maxlength="200" placeholder="Máximo 200 caracteres"></textarea>
        </fieldset>
        <br>

        <!-- Sección de Preferencias y Términos -->
        <fieldset>
            <legend>Preferencias y Términos</legend>

            <!-- Categorías de interés -->
            <label>Categorías de Interés:</label><br>
            <input type="checkbox" id="electronica" name="intereses" value="electronica">
            <label for="electronica">Electrónica</label><br>
            <input type="checkbox" id="indumentaria" name="intereses" value="indumentaria">
            <label for="indumentaria">Indumentaria</label><br>
            <input type="checkbox" id="hogar" name="intereses" value="hogar">
            <label for="hogar">Hogar</label><br>
            <input type="checkbox" id="otros" name="intereses" value="otros">
            <label for="otros">Otros</label>
            <br><br>

            <!-- Tipo de cliente -->
            <label>Tipo de Cliente:</label><br>
            <input type="radio" id="consumidor-final" name="tipo-cliente" value="consumidor-final" required>
            <label for="consumidor-final">Consumidor Final</label><br>
            <input type="radio" id="revendedor" name="tipo-cliente" value="revendedor">
            <label for="revendedor">Revendedor</label><br>
            <input type="radio" id="empresa" name="tipo-cliente" value="empresa">
            <label for="empresa">Empresa</label>
            <br><br>

            <!-- ¿Cómo nos conociste? -->
            <label for="conociste">¿Cómo nos conociste?</label>
            <select id="conociste" name="conociste" required>
                <option value="redes-sociales">Redes Sociales</option>
                <option value="recomendacion">Recomendación</option>
                <option value="busqueda-web">Búsqueda Web</option>
                <option value="publicidad">Publicidad</option>
                <option value="otro">Otro</option>
            </select>
            <br><br>

            <!-- Suscripción al newsletter -->
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Deseo suscribirme al newsletter</label>
            <br><br>

            <!-- Aceptación de términos y condiciones -->
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los <a href="#" target="_blank">Términos y Condiciones</a></label>
            <br><br>

            <!-- Aceptación de la Política de Privacidad -->
            <input type="checkbox" id="privacidad" name="privacidad" required>
            <label for="privacidad">Acepto la <a href="#" target="_blank">Política de Privacidad</a></label>
        </fieldset>
        <br>

        <!-- Botones de acción -->
        <div style="text-align: center;">
            <button type="submit" style="background-color: #0077cc; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Registrarme</button>
            <button type="reset" style="background-color: #ccc; color: black; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Limpiar formulario</button>
        </div>
        <br>

        <!-- Enlace para iniciar sesión -->
        <div style="text-align: center;">
            <a href="#" style="color: #0077cc; text-decoration: none;">Ya tengo cuenta, iniciar sesión</a>
        </div>
    </form>
</body>
</html>
