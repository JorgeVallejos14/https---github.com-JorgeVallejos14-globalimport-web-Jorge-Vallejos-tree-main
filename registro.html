<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css"> <!-- Conexión con el archivo CSS -->
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form action="#" method="post">
        <!-- Sección de Datos Personales -->
        <fieldset>
            <legend>Datos Personales</legend>

            <!-- Nombre completo -->
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>

            <!-- Fecha de nacimiento -->
            <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
            <br><br>

            <!-- RUT/Número de documento -->
            <label for="documento">RUT/Número de Documento:</label>
            <input type="text" id="documento" name="documento" required>
            <br><br>

            <!-- Género -->
            <label for="genero">Género:</label>
            <select id="genero" name="genero" required>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="no-binario">No Binario</option>
                <option value="prefiero-no-decir">Prefiero no decir</option>
            </select>
            <br><br>

            <!-- Nacionalidad -->
            <label for="nacionalidad">Nacionalidad:</label>
            <select id="nacionalidad" name="nacionalidad" required>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
                <option value="mexico">México</option>
                <option value="colombia">Colombia</option>
                <option value="peru">Perú</option>
                <option value="brasil">Brasil</option>
                <option value="uruguay">Uruguay</option>
                <option value="paraguay">Paraguay</option>
            </select>
        </fieldset>
        <br>

        <!-- Sección de Datos de Contacto y Acceso -->
        <fieldset>
            <legend>Datos de Contacto y Acceso</legend>

            <!-- Correo electrónico -->
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <!-- Confirmar correo electrónico -->
            <label for="confirmar-email">Confirmar Correo Electrónico:</label>
            <input type="email" id="confirmar-email" name="confirmar-email" required>
            <br><br>

            <!-- Contraseña -->
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <div id="password-strength" style="font-size: 0.9rem; color: gray;">Fuerza de la contraseña: débil</div>
            <br><br>

            <!-- Confirmar contraseña -->
            <label for="confirmar-password">Confirmar Contraseña:</label>
            <input type="password" id="confirmar-password" name="confirmar-password" required>
            <br><br>

            <!-- Teléfono -->
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+54 11 5555-0000" required>
        </fieldset>
        <br>

        <!-- Sección de Dirección de Entrega -->
        <fieldset>
            <legend>Dirección de Entrega</legend>

            <!-- País -->
            <label for="pais">País:</label>
            <select id="pais" name="pais" required>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
                <option value="mexico">México</option>
                <option value="colombia">Colombia</option>
                <option value="peru">Perú</option>
                <option value="brasil">Brasil</option>
                <option value="uruguay">Uruguay</option>
                <option value="paraguay">Paraguay</option>
            </select>
            <br><br>

            <!-- Provincia/Estado -->
            <label for="provincia">Provincia/Estado:</label>
            <input type="text" id="provincia" name="provincia" required>
            <br><br>

            <!-- Ciudad -->
            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" name="ciudad" required>
            <br><br>

            <!-- Calle y número -->
            <label for="calle-numero">Calle y Número:</label>
            <input type="text" id="calle-numero" name="calle-numero" required>
            <br><br>

            <!-- Código postal -->
            <label for="codigo-postal">Código Postal:</label>
            <input type="text" id="codigo-postal" name="codigo-postal" required>
            <br><br>

            <!-- Piso y departamento -->
            <label for="piso-departamento">Piso y Departamento (opcional):</label>
            <input type="text" id="piso-departamento" name="piso-departamento">
            <br><br>

            <!-- Referencia o instrucciones adicionales -->
            <label for="referencia">Referencia o Instrucciones Adicionales (opcional):</label>
            <textarea id="referencia" name="referencia" maxlength="200" placeholder="Máximo 200 caracteres"></textarea>
        </fieldset>
        <br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
